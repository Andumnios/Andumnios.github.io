        }</script><style>/* --- Structure et positionnement global du footer --- */
  footer, .footer, #footer, .site-footer {

    margin: 0 !important;
    font-family: 'Comic Neue', cursive, sans-serif !important;

  }

  }

  .footer-right-group { justify-content: flex-end !important; }

  /* --- Liens et navigation --- */

  /* --- Bouton Retour en haut --- */

    background-color: #fff2cc !important;
    color: #b7b988 !important;

  /* --- RÈGLES POUR GRANDS ÉCRANS (> 1600px) --- */

      height: 70px !important;
    }
    .footer-itch-btn:hover {
      transform: translate(90px, 0px) scale(1.08) !important;

    .footer-home-link {

      transform: translate(0px, 4px) !important;
    }
  }</style><script>document.addEventListener("DOMContentLoaded", function() {
  const footerElement = document.querySelector('footer, .footer, #footer, .site-footer');
  if (!footerElement) return;

  // --- 1. GESTION ROBUSTE DES URLS ---
  const isLocal = window.location.protocol === 'file:' || window.location.href.includes('preview');
  let mentionsUrl, homeUrl;

  if (isLocal) {
    const previewIndex = window.location.pathname.indexOf('preview');
    if (previewIndex !== -1) {
      const basePath = window.location.pathname.substring(0, previewIndex + 7);
      mentionsUrl = basePath + '/mentionslegales/index.html';
      homeUrl = basePath + '/index.html';
    } else {
      mentionsUrl = "../mentionslegales/index.html";
      homeUrl = "../index.html";
    }
  } else {
    mentionsUrl = "https://andumniosinteractif.com/mentionslegales";
    homeUrl = "https://andumniosinteractif.com/";
  }

  // --- 2. INJECTION DU HTML ---
  footerElement.innerHTML = `
    <div class="footer-custom-layout">
      <div class="footer-socials">
        <a href="https://andumnios-interactif.itch.io/pwyll/" target="_blank" rel="noopener" title="Itch.io" class="footer-itch-btn">
          <img src="https://andumniosinteractif.com/media/files/AjouterAlaCollection.webp" alt="Itch.io" class="footer-itch-img-mobile">
        </a>
      </div>
      <div class="footer-text">
        © Andumnios Interactif | <span id="footer-email-protect">...</span> | <a href="${mentionsUrl}" class="footer-link-mentions">Mentions Légales</a>
      </div>
      <div class="footer-right-group">
        <div class="footer-home-link">
          <a href="${homeUrl}" class="footer-nav-icon" title="Retour à l'accueil" aria-label="Retour à l'accueil">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          </a>
        </div>
        <div class="footer-back-to-top">
          <a href="#" id="back-to-top-btn" class="footer-nav-icon" title="Retour en haut" aria-label="Retour en haut">▲</a>
        </div>
      </div>
    </div>
  `;

  // --- 3. SÉCURISATION DE L'E-MAIL (BASE64) ---
  const emailEncoded = "Y29udGFjdEBhbmR1bW5pb3NpbnRlcmFjdGlmLmNvbQ==";
  const emailDecoded = atob(emailEncoded);
  const emailSpan = document.getElementById('footer-email-protect');
  
  if (emailSpan) {
    emailSpan.innerHTML = `<a href="mailto:${emailDecoded}" class="footer-link-email" style="text-decoration: underline;">${emailDecoded}</a>`;
  }

  // --- 4. ESPACEUR DYNAMIQUE (OPTIMISÉ PAR RESIZE OBSERVER) ---
  let spacer = document.getElementById('dynamic-footer-spacer');
  if (!spacer) {
    spacer = document.createElement('div');
    spacer.id = 'dynamic-footer-spacer';
    spacer.style.width = "100%";
    spacer.style.pointerEvents = "none";
    document.body.appendChild(spacer);
  }

  // Utilisation d'un ResizeObserver pour s'adapter instantanément et proprement à la hauteur réelle
  const updateSpacerHeight = () => {
    spacer.style.height = (footerElement.offsetHeight + 30) + "px";
  };
  
  updateSpacerHeight();
  
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(updateSpacerHeight);
    observer.observe(footerElement);
  } else {
    window.addEventListener('resize', updateSpacerHeight);
  }

  // --- 5. GESTION DU SCROLL FLUIDE ---
  document.addEventListener('click', function(e) {
    const targetBtn = e.target.closest('#back-to-top-btn');
    if (targetBtn) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
});</script></body></html>
